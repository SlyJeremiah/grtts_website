{% extends "admin/base.html" %}
{% load static %}

{% block extrastyle %}
    <style>
        /* Inline styles to ensure branding works */
        #header {
            background-color: #1e3c2c !important;
            border-bottom: 3px solid #ffd966 !important;
        }
        #branding h1, #branding h1 a {
            color: white !important;
        }
        #user-tools a {
            color: #ffd966 !important;
        }
        .module h2 {
            background-color: #2d5a3b !important;
        }
        .button, input[type="submit"], .submit-row input {
            background-color: #2d5a3b !important;
        }
    </style>
{% endblock %}

{% block branding %}
<div style="display: flex; align-items: center; gap: 15px;">
    <img src="{% static 'images/logo.a76307707669.png' %}" alt="GRTTS Logo" 
         style="height: 40px; width: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #ffd966;"
         onerror="this.style.display='none'">
    <div>
        <h1 style="margin: 0; color: white;">GRTTS Admin</h1>
    </div>
</div>
{% endblock %}
