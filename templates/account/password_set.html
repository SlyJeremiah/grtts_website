{% extends "base.html" %}

{% block title %}Set password - GRTTS{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-success text-white text-center">
                    <h4><i class="fas fa-lock"></i> Set password</h4>
                </div>
                <div class="card-body">
                    <p class="text-muted">You can set a password to log in directly (in addition to Google).</p>
                    <form method="post" action="{% url 'account_set_password' %}">
                        {% csrf_token %}

                        {% if form.non_field_errors %}
                            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                        {% endif %}

                        <div class="mb-3">
                            <label for="id_password1" class="form-label">Password</label>
                            <input type="password" name="password1" id="id_password1" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="id_password2" class="form-label">Confirm password</label>
                            <input type="password" name="password2" id="id_password2" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Set password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
