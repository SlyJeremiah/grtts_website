{% extends "base.html" %}

{% block title %}Change password - GRTTS{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-success text-white text-center">
                    <h4><i class="fas fa-key"></i> Change password</h4>
                </div>
                <div class="card-body">
                    <form method="post" action="{% url 'account_change_password' %}">
                        {% csrf_token %}

                        {% if form.non_field_errors %}
                            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                        {% endif %}

                        <div class="mb-3">
                            <label for="id_oldpassword" class="form-label">Current password</label>
                            <input type="password" name="oldpassword" id="id_oldpassword" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="id_new_password1" class="form-label">New password</label>
                            <input type="password" name="new_password1" id="id_new_password1" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="id_new_password2" class="form-label">Confirm new password</label>
                            <input type="password" name="new_password2" id="id_new_password2" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Change password</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{% url 'account_reset_password' %}">Forgot your password?</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
